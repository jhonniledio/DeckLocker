<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 215" width="460" height="215">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&amp;family=Space+Mono:wght@400&amp;display=swap');
    </style>

    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.9" fill="#1a2333" opacity="0.7"/>
    </pattern>

    <!-- Right-side fade mask -->
    <linearGradient id="rightFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="55%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.35"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect width="460" height="215" fill="url(#rightFade)"/>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="460" height="215" fill="#0e1114"/>

  <!-- Dot grid -->
  <rect width="460" height="215" fill="url(#dots)"/>

  <!-- Lock icon (right, partially bleeding) — hollow tube shackle -->
  <g mask="url(#fadeMask)">
    <g transform="translate(270, 7) scale(0.715)">
      <!-- Shackle outer stroke -->
      <path d="M 62 170 L 62 100 A 78 78 0 0 1 218 100 L 218 170"
            stroke="#4cc8d9" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Shackle inner cutout -->
      <path d="M 62 170 L 62 100 A 78 78 0 0 1 218 100 L 218 170"
            stroke="#0e1114" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Shackle hairline edge -->
      <path d="M 62 170 L 62 100 A 78 78 0 0 1 218 100 L 218 170"
            stroke="#4cc8d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
      <!-- Body -->
      <rect x="22" y="162" width="236" height="148" rx="16"
            stroke="#4cc8d9" stroke-width="2.5" fill="#0b0f15"/>
      <!-- Keyhole circle -->
      <circle cx="140" cy="222" r="20" fill="#4cc8d9" opacity="0.9"/>
      <!-- Keyhole notch -->
      <rect x="131" y="240" width="18" height="34" rx="5" fill="#4cc8d9" opacity="0.9"/>
      <!-- Corner accent ticks -->
      <line x1="22" y1="185" x2="22" y2="195" stroke="#4cc8d9" stroke-width="2" opacity="0.35"/>
      <line x1="258" y1="185" x2="258" y2="195" stroke="#4cc8d9" stroke-width="2" opacity="0.35"/>
      <line x1="22" y1="285" x2="22" y2="295" stroke="#4cc8d9" stroke-width="2" opacity="0.35"/>
      <line x1="258" y1="285" x2="258" y2="295" stroke="#4cc8d9" stroke-width="2" opacity="0.35"/>
    </g>
  </g>

  <!-- Text block -->
  <!-- Sub-label -->
  <text x="28" y="58"
        font-family="'Space Mono', 'Courier New', monospace"
        font-size="8" font-weight="400"
        fill="#4cc8d9" opacity="0.85"
        letter-spacing="3">DECKY PLUGIN</text>

  <!-- Plugin name -->
  <text x="28" y="108"
        font-family="'Rajdhani', 'Arial Narrow', sans-serif"
        font-size="46" font-weight="700"
        fill="#e6edf8" letter-spacing="-0.5">DeckLocker</text>

  <!-- Accent rule -->
  <rect x="28" y="118" width="26" height="2" rx="1" fill="#4cc8d9"/>

  <!-- Tagline -->
  <text x="28" y="141"
        font-family="'Space Mono', 'Courier New', monospace"
        font-size="7.5" font-weight="400"
        fill="#4a6278" letter-spacing="1">Lock your games behind a PIN.</text>
  <text x="28" y="156"
        font-family="'Space Mono', 'Courier New', monospace"
        font-size="7.5" font-weight="400"
        fill="#4a6278" letter-spacing="1">No PIN, no launch.</text>
</svg>
